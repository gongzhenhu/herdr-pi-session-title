id = "gongzhenhu.herdr-pi-session-title"
name = "Pi Session Title"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Reports the pi coding agent session title (/name or first prompt) as the herdr pane metadata title"
platforms = ["linux", "macos"]

[[actions]]
id = "install"
title = "Install pi extension"
contexts = ["workspace"]
command = ["sh", "scripts/install.sh"]

[[actions]]
id = "uninstall"
title = "Uninstall pi extension"
contexts = ["workspace"]
command = ["sh", "scripts/uninstall.sh"]

[[actions]]
id = "status"
title = "Show extension installation status"
contexts = ["workspace"]
command = ["sh", "scripts/status.sh"]
